name: Check for Antigravity Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check version and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(curl -fsSL https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json | jq -r .version)
          echo "Latest Antigravity CLI version is: $LATEST"
          
          # Check if we already have a release for this version
          if ! gh release view "v$LATEST" > /dev/null 2>&1; then
            echo "Release v$LATEST not found. Creating..."
            gh release create "v$LATEST" --title "Antigravity CLI v$LATEST" --notes "Automated release for Antigravity CLI version $LATEST"
          else
            echo "Release v$LATEST already exists. Skipping."
          fi
